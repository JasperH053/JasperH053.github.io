name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    # OPLOSSING: Vertel de server dat alle commando's in de 'portfolio' map moeten draaien
    defaults:
      run:
        working-directory: ./portfolio
        
    steps:
      - name: Haal de code op
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" 

      - name: Installeer dependencies
        run: npm install --legacy-peer-deps 

      - name: Build het Vue project
        run: npm run build

      # GitHub Pages heeft geen SPA-fallback: met een 404.html laadt /about ook bij herladen de app
      - name: Maak 404.html fallback voor de router
        run: cp dist/index.html dist/404.html

      - name: Upload de gebouwde bestanden
        uses: actions/upload-pages-artifact@v3
        with:
          # OPLOSSING: Vite zet de gebouwde bestanden nu in portfolio/dist
          path: portfolio/dist 

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4