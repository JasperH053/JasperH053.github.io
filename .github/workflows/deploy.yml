name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # Dit is belangrijk voor GitHub Pages om de juiste omgeving te laden
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Haal de code op
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Opgelost: We gebruiken nu expliciet de nieuwste Node versie!

      - name: Installeer dependencies
        # Opgelost: We vertellen de server dat hij niet mag crashen op die oxlint fout!
        run: npm install --legacy-peer-deps 

      - name: Build het Vue project
        run: npm run build

      - name: Upload de gebouwde bestanden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist 

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4